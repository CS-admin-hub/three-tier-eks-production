# frontend/nginx.conf 

server { 

    listen 3000; 

    server_name _; 

    root /usr/share/nginx/html; 

    index index.html; 

  

    # SPA fallback: every unknown path returns index.html 

    # Without this, refreshing /tasks returns 404 (nginx can't find the file) 

    location / { 

        try_files $uri $uri/ /index.html; 

    } 

  

    # Proxy API calls to backend K8s service 

    # Frontend calls /api/tasks → nginx proxies to backend:8080 

    location /api { 

        proxy_pass http://backend:8080; 

        proxy_http_version 1.1; 

        proxy_set_header Host $host; 

        proxy_set_header X-Real-IP $remote_addr; 

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 

    } 

  

    # Health check endpoint for K8s readiness probe 

    location /health { 

        return 200 'healthy'; 

        add_header Content-Type text/plain; 

    } 

} 
