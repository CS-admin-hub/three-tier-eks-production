# frontend/nginx.conf
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router support - serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend K8s service internally
    # REACT_APP_BACKEND_URL=/api/tasks → nginx proxies to backend:8080
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check for K8s readiness probe
    location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}