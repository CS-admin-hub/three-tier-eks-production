# karpenter/ec2nodeclass.yaml
# NOTE: Replace three-tier-cluster if you used a different cluster name
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2 # Amazon Linux 2 - EKS optimized
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: three-tier-cluster # Tags set during cluster setup
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: three-tier-cluster
  role: KarpenterNodeRole-three-tier-cluster # Created via CloudFormation
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        deleteOnTermination: true
        encrypted: true # Encrypt node root volume
