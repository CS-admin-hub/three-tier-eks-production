# karpenter/ec2nodeclass.yaml
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # amiFamily replaced by amiSelectorTerms in v1.0.0
  amiSelectorTerms:
    - alias: al2@latest # Amazon Linux 2, latest version
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: three-tier-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: three-tier-cluster
  role: KarpenterNodeRole-three-tier-cluster
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        deleteOnTermination: true
        encrypted: true
