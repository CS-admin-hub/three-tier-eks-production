# karpenter/nodepool.yaml
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        intent: apps
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [t3.small, t3.medium, t3.large]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-1a, us-east-1b]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand] # Spot first, On-Demand as fallback
      # Recycle nodes every 720h to stay on latest AMI

      expireAfter: 720h
  limits:
    cpu: "16"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30s # Remove underutilized nodes after 30s
