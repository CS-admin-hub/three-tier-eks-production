apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        intent: apps
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        # ✅ Force architecture
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        # ✅ Force ONLY standard instances (no GPU / accelerator)
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.medium
            - t3.large

        # ✅ Zone restriction
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-1a
            - us-east-1b

        # ✅ Capacity type
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        # 🔥 IMPORTANT FIX (THIS IS THE KEY)
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: DoesNotExist

        - key: karpenter.k8s.aws/instance-accelerator-count
          operator: DoesNotExist

      expireAfter: 720h

  limits:
    cpu: "16"
    memory: 32Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s