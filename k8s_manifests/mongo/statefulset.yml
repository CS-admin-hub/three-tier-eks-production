# k8s_manifests/mongo/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: workshop
spec:
  serviceName: mongodb-svc
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0 # Pinned - never use latest in production
          ports:
            - containerPort: 27017
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999 # mongodb runs as uid 999
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3 # Faster and cheaper than gp2
        resources:
          requests:
            storage: 10Gi
