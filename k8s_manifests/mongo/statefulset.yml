# k8s_manifests/mongo/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: workshop
spec:
  serviceName: mongodb-svc
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # CRITICAL: Ensures the mounted EBS volume has correct permissions for MongoDB user (UID 999)
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch # Speeds up pod startup
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          # Environment variables for MongoDB authentication

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_DATABASE
          livenessProbe:
            exec:
              command:
                - mongosh
                - -u
                - "$(MONGO_INITDB_ROOT_USERNAME)"
                - -p
                - "$(MONGO_INITDB_ROOT_PASSWORD)"
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - -u
                - "$(MONGO_INITDB_ROOT_USERNAME)"
                - -p
                - "$(MONGO_INITDB_ROOT_PASSWORD)"
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999 # MongoDB runs as uid 999
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
