# k8s_manifests/ingress/full_stack_lb.yml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mainlb
  namespace: workshop
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # HTTP only for now - HTTPS enabled after ACM cert is ready

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    # Uncomment below after ACM cert is created:
# alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
# alb.ingress.kubernetes.io/ssl-redirect: '443'
# alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:851725602228:certificate/<CERT_ID>
# alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:851725602228:regional/webacl/eks-waf/<WAF_ID>

spec:
  ingressClassName: alb
  rules:
    # Uncomment after Route53 record created:
    # - host: app.learn.cloudshastrainfotech.com
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

