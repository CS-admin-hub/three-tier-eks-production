# k8s_manifests/security/external-secret.yaml
# Pulls MongoDB URI from AWS Secrets Manager into a K8s Secret automatically
# apiVersion: external-secrets.io/v1beta1
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: workshop
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

# apiVersion: external-secrets.io/v1beta1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: workshop
spec:
  refreshInterval: 1h # Re-sync from Secrets Manager every hour
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: mongodb-secret # Name of K8s Secret that gets created
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: prod/three-tier/mongodb # Path in AWS Secrets Manager
        property: uri
