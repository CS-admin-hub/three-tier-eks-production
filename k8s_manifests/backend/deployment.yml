apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: workshop
  labels:
    app: backend
    version: "1.0"

spec:
  replicas: 2

  selector:
    matchLabels:
      role: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime: old pod never killed before new is ready

  template:
    metadata:
      labels:
        role: backend
        app: backend
      annotations:
        # NEW in v2: Prometheus scrape annotation — used by Phase 4 monitoring
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"

    spec:
      serviceAccountName: backend-sa   # IRSA — inherits BackendIRSARole

      # Preferred anti-affinity: tries different nodes but doesn't block scheduling
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: role
                      operator: In
                      values: [backend]
                topologyKey: kubernetes.io/hostname

      # NEW in v2: spread pods across AZs — prevents both replicas in same AZ
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              role: backend

      containers:
        - name: backend
          image: 851725602228.dkr.ecr.us-east-1.amazonaws.com/three-tier-backend:latest

          ports:
            - containerPort: 8080

          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret   # created by External Secrets Operator
                  key: MONGO_URI
            - name: NODE_ENV
              value: "production"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: docdb-tls
              mountPath: /etc/ssl/docdb   # must match tlsCAFile in MONGO_URI
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}
        - name: docdb-tls
          configMap:
            name: docdb-tls

      terminationGracePeriodSeconds: 30
