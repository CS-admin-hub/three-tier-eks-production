name: Build and Push to ECR

on:
  push:
    branches:
      - dev
      # - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: 851725602228

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851725602228:role/GitHubApp-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Frontend
        run: docker build -t frontend:${IMAGE_TAG} ./frontend

      - name: Tag Frontend
        run: |
          docker tag frontend:${IMAGE_TAG} \
          ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-frontend:${IMAGE_TAG}

      - name: Push Frontend
        run: |
          docker push ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-frontend:${IMAGE_TAG}

      - name: Build Backend
        run: docker build -t backend:${IMAGE_TAG} ./backend

      - name: Tag Backend
        run: |
          docker tag backend:${IMAGE_TAG} \
          ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-backend:${IMAGE_TAG}

      - name: Push Backend
        run: |
          docker push ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-backend:${IMAGE_TAG}
