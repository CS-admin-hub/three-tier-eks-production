# backup/velero-schedule.yaml
# Velero backs up entire cluster state + PVCs to S3 every day at 2 AM
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  schedule: "0 2 * * *" # Every day at 2 AM UTC
  template:
    includedNamespaces:
      - workshop
      - monitoring
    storageLocation: default
    volumeSnapshotLocations:
      - default
    ttl: 720h0m0s # Keep backups for 30 days then auto-delete
